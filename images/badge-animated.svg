<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="56" height="56" role="img"><style>
.disc,.sun,.ray{transform-box:fill-box}
.disc{transform-origin:center;animation:disc .7s cubic-bezier(.3,1.4,.5,1) both}
.sun{animation:rise 1s cubic-bezier(.2,.8,.2,1) .5s both}
.ray{animation:draw .35s ease-in-out calc(1.5s + var(--i) * .08s) both}
.ru{animation:none;opacity:1}
@keyframes disc{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}1%{opacity:1}to{stroke-dasharray:1;stroke-dashoffset:0;opacity:1}}
@media (prefers-reduced-motion:reduce){.disc,.sun,.ray{animation:none}.ru{animation:none;opacity:1}}
